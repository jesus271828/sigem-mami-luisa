<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gestión de Rúbricas - SIGEM Mami Luisa</title>
  <style>
    :root {
      --bg-page: #f4f6fb;
      --header-bg: #1e2229;
      --card-bg: #ffffff;
      --accent-header: #c5bbf7;
      --accent-border: #8b7ce8;
      --text-dark: #1d2238;
      --border-color: #333748;
    }

    * {
      box-sizing: border-box;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      margin: 0;
      background: var(--bg-page);
      color: var(--text-dark);
    }

    .topbar {
      background: var(--header-bg);
      color: #fff;
      padding: 12px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .topbar a {
      color: #fff;
      text-decoration: none;
      font-size: 14px;
    }

    .container {
      max-width: 1440px;
      margin: 24px auto;
      padding: 0 16px 40px;
    }

    .toolbar {
      background: var(--card-bg);
      padding: 16px 20px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
      margin-bottom: 20px;
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      align-items: center;
      justify-content: space-between;
    }

    .filtros {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
    }

    .campo-grupo {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      font-weight: 700;
    }

    .campo-grupo select {
      padding: 7px 10px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 700;
      color: var(--text-dark);
      background: #fff;
    }

    .tabs {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .tab-btn {
      border: 1px solid #cbd5e1;
      background: #f8fafc;
      color: var(--text-dark);
      padding: 7px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      font-size: 13px;
    }

    .tab-btn.active {
      background: var(--text-dark);
      color: #fff;
      border-color: var(--text-dark);
    }

    .actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .btn {
      border: none;
      padding: 8px 13px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      font-size: 13px;
    }

    .btn-primary {
      background: #2563eb;
      color: #fff;
    }

    .btn-success {
      background: #16a34a;
      color: #fff;
    }

    .btn-secondary {
      background: #e2e8f0;
      color: #1e293b;
    }

    .rubrica-panel {
      display: none;
      background: var(--card-bg);
      padding: 16px;
      border-radius: 8px;
      border-top: 4px solid var(--accent-border);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
      overflow-x: auto;
      margin-bottom: 18px;
    }

    .rubrica-panel.active {
      display: block;
    }

    table.matriz {
      width: 100%;
      border-collapse: collapse;
      min-width: 1020px;
    }

    table.matriz th,
    table.matriz td {
      border: 1px solid var(--border-color);
      padding: 6px;
      font-size: 12px;
    }

    .encabezado-area {
      background: var(--accent-header);
      color: var(--text-dark);
      text-align: left;
      vertical-align: middle;
      padding: 10px !important;
      min-width: 310px;
      transition: background-color 0.2s ease;
    }

    .input-area {
      width: 100%;
      background: transparent;
      border: 1px dashed transparent;
      font-size: 16px;
      font-weight: 800;
      color: var(--text-dark);
      padding: 2px 4px;
      margin-bottom: 4px;
      text-transform: uppercase;
    }

    .textarea-comp {
      width: 100%;
      background: transparent;
      border: 1px dashed transparent;
      font-size: 13px;
      font-weight: 700;
      color: var(--text-dark);
      padding: 2px 4px;
      resize: vertical;
      line-height: 1.3;
    }

    .input-area:hover,
    .textarea-comp:hover,
    .textarea-indicador:hover,
    .input-valor:hover {
      border-color: rgba(29, 34, 56, 0.45);
      background: rgba(255, 255, 255, 0.5);
    }

    .input-area:focus,
    .textarea-comp:focus,
    .textarea-indicador:focus,
    .input-valor:focus {
      outline: none;
      border: 1px solid #2563eb;
      background: #ffffff;
      border-radius: 4px;
    }

    .th-valor {
      background: var(--accent-header);
      color: var(--text-dark);
      width: 66px;
      text-align: center;
      vertical-align: bottom;
      font-size: 13px !important;
      font-weight: 800;
      transition: background-color 0.2s ease;
    }

    .th-alumno {
      background: #fff;
      color: var(--text-dark);
      height: 115px;
      width: 44px;
      padding: 4px 2px !important;
      vertical-align: bottom;
      text-align: center;
    }

    .nombre-vertical {
      writing-mode: vertical-rl;
      transform: rotate(180deg);
      white-space: nowrap;
      font-weight: 800;
      font-size: 13px;
      margin: 0 auto;
    }

    .celda-indicador {
      padding: 4px 6px !important;
    }

    .fila-indicador-flex {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .textarea-indicador {
      width: 100%;
      border: 1px dashed transparent;
      background: transparent;
      font-weight: 700;
      font-size: 12px;
      line-height: 1.25;
      color: #111827;
      resize: vertical;
      padding: 3px 4px;
      min-height: 34px;
    }

    .btn-del-fila {
      border: none;
      background: transparent;
      color: #dc2626;
      font-weight: bold;
      cursor: pointer;
      padding: 2px 5px;
      border-radius: 4px;
      font-size: 13px;
      opacity: 0.65;
    }

    .btn-del-fila:hover {
      opacity: 1;
      background: #fee2e2;
    }

    .celda-valor {
      text-align: center;
      padding: 2px !important;
    }

    .input-valor {
      width: 100%;
      height: 32px;
      border: 1px dashed transparent;
      background: transparent;
      text-align: center;
      font-weight: 800;
      font-size: 15px;
      color: var(--text-dark);
    }

    .celda-nota {
      padding: 2px !important;
      text-align: center;
    }

    .nota-input {
      width: 100%;
      height: 30px;
      border: 1px solid transparent;
      text-align: center;
      font-weight: 800;
      font-size: 13px;
      color: var(--text-dark);
      background: transparent;
    }

    .nota-input:focus {
      outline: none;
      border: 1px solid #2563eb;
      background: #eff6ff;
      border-radius: 3px;
    }

    .fila-total td {
      font-weight: 800;
      font-size: 14px !important;
      background: #f8fafc;
      color: var(--text-dark);
    }

    .etiqueta-total {
      text-align: right;
      padding-right: 12px !important;
      letter-spacing: 0.3px;
    }

    .total-alumno,
    .total-valor-max {
      text-align: center;
    }

    .panel-footer {
      margin-top: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    @media print {
      .topbar, .toolbar, .panel-footer, .btn-del-fila {
        display: none !important;
      }
      .rubrica-panel {
        display: block !important;
        box-shadow: none;
        page-break-after: always;
      }
      .input-area, .textarea-comp, .textarea-indicador, .input-valor {
        border: none !important;
        resize: none;
      }
    }
  </style>
</head>
<body>
  <div class="topbar">
    <strong>SIGEM Mami Luisa</strong>
    <a href="/">Inicio</a>
  </div>

  <div class="container">
    <div class="toolbar">
      <div class="filtros">
        <div class="campo-grupo">
          <label for="select-materia">Materia / Área:</label>
          <select id="select-materia" onchange="cambiarMateria()">
            {% if materias %}
              {% for m in materias %}
                <option value="{{ m }}">{{ m }}</option>
              {% endfor %}
            {% else %}
              <option value="MATEMÁTICA">MATEMÁTICA</option>
              <option value="LENGUA ESPAÑOLA">LENGUA ESPAÑOLA</option>
              <option value="CIENCIAS SOCIALES">CIENCIAS SOCIALES</option>
              <option value="CIENCIAS DE LA NATURALEZA">CIENCIAS DE LA NATURALEZA</option>
              <option value="INGLÉS">INGLÉS</option>
              <option value="INFORMÁTICA">INFORMÁTICA</option>
              <option value="EDUCACIÓN FÍSICA">EDUCACIÓN FÍSICA</option>
              <option value="EDUCACIÓN ARTÍSTICA">EDUCACIÓN ARTÍSTICA</option>
              <option value="FORMACIÓN INTEGRAL HUMANA Y RELIGIOSA">FORMACIÓN INTEGRAL HUMANA Y RELIGIOSA</option>
            {% endif %}
          </select>
        </div>

        <div class="tabs">
          <button type="button" class="tab-btn active" data-target="c1">C1 - Comunicativa</button>
          <button type="button" class="tab-btn" data-target="c2">C2 - Pensamiento Lógico...</button>
          <button type="button" class="tab-btn" data-target="c3">C3 - Ética y Ciudadana...</button>
          <button type="button" class="tab-btn" data-target="todas">Ver las 3 juntas</button>
        </div>
      </div>

      <div class="actions">
        <button type="button" class="btn btn-success" onclick="guardarLocal()">Guardar cambios</button>
        <button type="button" class="btn btn-secondary" onclick="limpiarNotas()">Limpiar notas</button>
        <button type="button" class="btn btn-primary" onclick="window.print()">Imprimir / PDF</button>
      </div>
    </div>

    <div id="contenedor-rubricas"></div>
  </div>

  <script>
    const ESTUDIANTES_RESPALDO = [
      "Adrian", "Albert", "Amaiha", "Ammy", "Brithany", "Dayrelin",
      "Gabriela", "Jeyden", "Keisha", "Marcos", "Nashly", "Rochell", "Sebastian"
    ];

    const ESTUDIANTES_FLASK = JSON.parse('{{ (estudiantes or []) | tojson | safe }}');
    const ESTUDIANTES = Array.isArray(ESTUDIANTES_FLASK) && ESTUDIANTES_FLASK.length > 0
      ? ESTUDIANTES_FLASK
      : ESTUDIANTES_RESPALDO;

    const COLORES_MATERIAS = [
      { header: "#c5bbf7", border: "#8b7ce8" }, // Lila suave
      { header: "#bae6fd", border: "#0284c7" }, // Celeste
      { header: "#bbf7d0", border: "#16a34a" }, // Verde menta
      { header: "#fde68a", border: "#d97706" }, // Amarillo cálido
      { header: "#fbcfe8", border: "#db2777" }, // Rosa pastel
      { header: "#fed7aa", border: "#ea580c" }, // Durazno / naranja suave
      { header: "#ddd6fe", border: "#7c3aed" }, // Violeta claro
      { header: "#99f6e4", border: "#0d9488" }, // Turquesa suave
      { header: "#fecaca", border: "#dc2626" }  // Coral suave
    ];

    function obtenerPaletaMateria(materia) {
      const clave = (materia || "").toUpperCase();
      if (clave.includes("MATEM")) return COLORES_MATERIAS[0];
      if (clave.includes("LENGUA") || clave.includes("ESPAÑ")) return COLORES_MATERIAS[1];
      if (clave.includes("SOCIAL")) return COLORES_MATERIAS[2];
      if (clave.includes("NATURAL")) return COLORES_MATERIAS[3];
      if (clave.includes("INGL")) return COLORES_MATERIAS[4];
      if (clave.includes("INFORM")) return COLORES_MATERIAS[5];
      if (clave.includes("FÍSICA") || clave.includes("FISICA")) return COLORES_MATERIAS[6];
      if (clave.includes("ARTÍSTI") || clave.includes("ARTISTI")) return COLORES_MATERIAS[7];
      if (clave.includes("FORMACIÓN") || clave.includes("FORMACION")) return COLORES_MATERIAS[8];

      let hash = 0;
      for (let i = 0; i < clave.length; i++) {
        hash = clave.charCodeAt(i) + ((hash << 5) - hash);
      }
      return COLORES_MATERIAS[Math.abs(hash) % COLORES_MATERIAS.length];
    }

    function aplicarColorMateria(materia) {
      const paleta = obtenerPaletaMateria(materia);
      document.documentElement.style.setProperty("--accent-header", paleta.header);
      document.documentElement.style.setProperty("--accent-border", paleta.border);
    }

    const COMPETENCIAS_BASE = [
      { id: "c1", competencia: "C1 - COMUNICATIVA" },
      { id: "c2", competencia: "C2\nPensamiento Lógico Creativo y Crítico; Resolución de Problemas; Científica y Tecnológica" },
      { id: "c3", competencia: "C3 - Ética y Ciudadana; Desarrollo Personal y Espiritual; Ambiental y de la Salud" }
    ];

    function crearIndicadoresVacios(cantidad = 10) {
      return Array.from({ length: cantidad }, () => ({
        texto: "",
        valor: 10,
        notas: {}
      }));
    }

    function obtenerMateriaActual() {
      return document.getElementById("select-materia").value;
    }

    function claveStorage(materia) {
      return `sigem_rubrica_v2_${materia}`;
    }

    function cargarDatosMateria(materia) {
      const guardado = localStorage.getItem(claveStorage(materia));
      if (guardado) {
        return JSON.parse(guardado);
      }
      return COMPETENCIAS_BASE.map((comp) => ({
        id: comp.id,
        areaTexto: `ÁREA: ${materia.toUpperCase()}`,
        competencia: comp.competencia,
        indicadores: crearIndicadoresVacios(10)
      }));
    }

    let datosActuales = [];
    let pestanaActiva = "c1";

    function renderizarTablas() {
      const contenedor = document.getElementById("contenedor-rubricas");
      contenedor.innerHTML = datosActuales
        .map((comp, compIdx) => {
          const totalMaximo = comp.indicadores.reduce(
            (acc, item) => acc + (parseFloat(item.valor) || 0),
            0
          );

          const headersAlumnos = ESTUDIANTES.map(
            (nombre) => `<th class="th-alumno"><div class="nombre-vertical">${nombre}</div></th>`
          ).join("");

          const filasIndicadores = comp.indicadores
            .map((ind, filaIdx) => {
              const celdasNotas = ESTUDIANTES.map((est, colIdx) => {
                const notaGuardada = ind.notas && ind.notas[est] !== undefined ? ind.notas[est] : "";
                return `
                  <td class="celda-nota">
                    <input
                      type="number"
                      class="nota-input"
                      min="0"
                      max="${ind.valor}"
                      step="any"
                      value="${notaGuardada}"
                      data-comp="${compIdx}"
                      data-fila="${filaIdx}"
                      data-col="${colIdx}"
                      data-est="${est}"
                      oninput="actualizarNota(${compIdx}, ${filaIdx}, ${colIdx}, '${est}', this)"
                    />
                  </td>`;
              }).join("");

              return `
                <tr>
                  <td class="celda-indicador">
                    <div class="fila-indicador-flex">
                      <textarea
                        class="textarea-indicador"
                        rows="2"
                        placeholder="Escribe el indicador de logro..."
                        oninput="datosActuales[${compIdx}].indicadores[${filaIdx}].texto = this.value"
                      >${ind.texto || ""}</textarea>
                      <button type="button" class="btn-del-fila" title="Eliminar indicador" onclick="eliminarIndicador(${compIdx}, ${filaIdx})">✕</button>
                    </div>
                  </td>
                  <td class="celda-valor">
                    <input
                      type="number"
                      class="input-valor"
                      min="0"
                      step="any"
                      value="${ind.valor}"
                      oninput="actualizarValorIndicador(${compIdx}, ${filaIdx}, this.value)"
                    />
                  </td>
                  ${celdasNotas}
                </tr>`;
            })
            .join("");

          const celdasTotales = ESTUDIANTES.map(
            (_, colIdx) => `<td class="total-alumno" id="total-${compIdx}-${colIdx}">0</td>`
          ).join("");

          const visible = pestanaActiva === "todas" || pestanaActiva === comp.id ? "active" : "";

          return `
            <section class="rubrica-panel ${visible}" id="panel-${comp.id}">
              <table class="matriz">
                <thead>
                  <tr>
                    <th class="encabezado-area">
                      <input
                        type="text"
                        class="input-area"
                        value="${comp.areaTexto}"
                        oninput="datosActuales[${compIdx}].areaTexto = this.value"
                      />
                      <textarea
                        class="textarea-comp"
                        rows="2"
                        oninput="datosActuales[${compIdx}].competencia = this.value"
                      >${comp.competencia}</textarea>
                    </th>
                    <th class="th-valor">VALOR</th>
                    ${headersAlumnos}
                  </tr>
                </thead>
                <tbody>
                  ${filasIndicadores}
                  <tr class="fila-total">
                    <td class="etiqueta-total">PUNTAJE TOTAL DE LA COMPETENCIA</td>
                    <td class="total-valor-max" id="max-${compIdx}">${totalMaximo}</td>
                    ${celdasTotales}
                  </tr>
                </tbody>
              </table>
              <div class="panel-footer">
                <button type="button" class="btn btn-secondary" onclick="agregarIndicador(${compIdx})">+ Agregar indicador</button>
                <small style="color:#64748b;">Haz clic directamente sobre el área, competencia, indicadores o valores para editarlos.</small>
              </div>
            </section>`;
        })
        .join("");

      recalcularTodo();
    }

    function actualizarValorIndicador(compIdx, filaIdx, nuevoValor) {
      const val = parseFloat(nuevoValor) || 0;
      datosActuales[compIdx].indicadores[filaIdx].valor = val;

      document
        .querySelectorAll(`.nota-input[data-comp="${compIdx}"][data-fila="${filaIdx}"]`)
        .forEach((inp) => {
          inp.max = val;
        });

      const totalMax = datosActuales[compIdx].indicadores.reduce(
        (acc, item) => acc + (parseFloat(item.valor) || 0),
        0
      );
      document.getElementById(`max-${compIdx}`).textContent = totalMax;
      recalcularTodo();
    }

    function actualizarNota(compIdx, filaIdx, colIdx, est, inputEl) {
      const maxVal = parseFloat(datosActuales[compIdx].indicadores[filaIdx].valor) || 0;
      let val = parseFloat(inputEl.value);

      if (inputEl.value !== "") {
        if (isNaN(val) || val < 0) {
          inputEl.value = 0;
          val = 0;
        } else if (val > maxVal) {
          inputEl.value = maxVal;
          val = maxVal;
        }
        datosActuales[compIdx].indicadores[filaIdx].notas[est] = val;
      } else {
        delete datosActuales[compIdx].indicadores[filaIdx].notas[est];
      }

      recalcularColumna(compIdx, colIdx);
    }

    function recalcularColumna(compIdx, colIdx) {
      const inputs = document.querySelectorAll(
        `.nota-input[data-comp="${compIdx}"][data-col="${colIdx}"]`
      );
      let suma = 0;
      inputs.forEach((inp) => {
        const n = parseFloat(inp.value);
        if (!isNaN(n)) suma += n;
      });
      const totalCell = document.getElementById(`total-${compIdx}-${colIdx}`);
      if (totalCell) {
        totalCell.textContent = Number.isInteger(suma) ? suma : suma.toFixed(1);
      }
    }

    function recalcularTodo() {
      datosActuales.forEach((_, compIdx) => {
        ESTUDIANTES.forEach((__, colIdx) => {
          recalcularColumna(compIdx, colIdx);
        });
      });
    }

    function agregarIndicador(compIdx) {
      datosActuales[compIdx].indicadores.push({
        texto: "",
        valor: 10,
        notas: {}
      });
      renderizarTablas();
    }

    function eliminarIndicador(compIdx, filaIdx) {
      if (datosActuales[compIdx].indicadores.length <= 1) return;
      datosActuales[compIdx].indicadores.splice(filaIdx, 1);
      renderizarTablas();
    }

    function guardarLocal() {
      const materia = obtenerMateriaActual();
      localStorage.setItem(claveStorage(materia), JSON.stringify(datosActuales));
      alert(`Rúbrica de ${materia} guardada correctamente.`);
    }

    function limpiarNotas() {
      datosActuales.forEach((comp) => {
        comp.indicadores.forEach((ind) => {
          ind.notas = {};
        });
      });
      renderizarTablas();
    }

    function cambiarMateria() {
      const materia = obtenerMateriaActual();
      aplicarColorMateria(materia);
      datosActuales = cargarDatosMateria(materia);
      renderizarTablas();
    }

    document.querySelectorAll(".tab-btn").forEach((btn) => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".tab-btn").forEach((b) => b.classList.remove("active"));
        btn.classList.add("active");
        pestanaActiva = btn.dataset.target;
        renderizarTablas();
      });
    });

    cambiarMateria();
  </script>
</body>
</html>
