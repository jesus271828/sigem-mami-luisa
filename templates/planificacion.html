<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Esquema de Planificación - SIGEM Mami Luisa</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            font-size: 13px; 
            color: #2c3e50; 
            background-color: #eef2f7; /* Fondo general con tono azulado suave */
        }
        
        /* BARRA DE ACCIONES SUPERIOR */
        .action-bar {
            background: #1b263b;
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.15);
            margin-bottom: 25px;
        }
        .action-bar .left-group, .action-bar .right-group {
            display: flex;
            gap: 12px;
            align-items: center;
        }
        .btn-custom {
            padding: 8px 16px;
            font-size: 13px;
            font-weight: 600;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: #fff;
            transition: background 0.2s;
        }
        .btn-pdf { background-color: #c0392b; }
        .btn-pdf:hover { background-color: #a93226; color: #fff; }
        .btn-save { background-color: #27ae60; }
        .btn-save:hover { background-color: #219653; color: #fff; }
        .btn-view { background-color: #2980b9; }
        .btn-view:hover { background-color: #2471a3; color: #fff; }
        .btn-menu { background-color: #415a77; }
        .btn-menu:hover { background-color: #324a61; color: #fff; }

        /* CONTENEDOR PRINCIPAL */
        .main-container {
            max-width: 1100px;
            margin: 0 auto 40px auto;
            background: #ffffff;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
            border-top: 5px solid #1d3557;
        }

        /* ENCABEZADO INSTITUCIONAL */
        .header { display: flex; align-items: center; border-bottom: 2px solid #e0e6ed; margin-bottom: 25px; padding-bottom: 15px; }
        .logo { width: 75px; margin-right: 15px; }
        .header-content { flex-grow: 1; }
        .header-row-1 { display: flex; justify-content: space-between; align-items: baseline; }
        .title-school { font-size: 18px; font-weight: bold; color: #1d3557; margin: 0; font-family: 'Times New Roman', serif; }
        .lema { font-size: 12px; font-style: italic; color: #d97706; font-family: 'Times New Roman', serif; }
        .info-line { font-size: 12px; margin: 2px 0; color: #4b5563; }

        /* SECCIONES Y BLOQUES */
        .section-box {
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            padding: 18px;
            margin-bottom: 20px;
            background: #f8fafc;
            box-shadow: inset 0 1px 2px rgba(0,0,0,0.02);
        }
        
        label { font-weight: 600; color: #1e293b; font-size: 13px; margin-bottom: 6px; display: block; }
        
        /* CAMPOS DE TEXTO E INPUTS */
        .form-control, .form-select { 
            border: 1px solid #94a3b8 !important; 
            background-color: #ffffff !important;
            font-size: 13px; 
            padding: 9px 12px; 
            border-radius: 6px; 
            color: #0f172a;
        }
        .form-control:focus, .form-select:focus { 
            border-color: #2563eb !important; 
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15); 
        }
        
        /* ESTILOS PARA IMPRESIÓN / PDF */
        @media print {
            body { background-color: #fff; font-size: 10px; color: #000; }
            .action-bar { display: none !important; }
            .main-container { max-width: 100% !important; padding: 5px !important; box-shadow: none !important; border-top: none; }
            .section-box { background: #fff !important; border: 1px solid #000 !important; padding: 8px !important; margin-bottom: 10px !important; box-shadow: none !important; }
            .form-control, .form-select { border: 1px solid #000 !important; font-size: 10px !important; padding: 4px !important; background: #fff !important; }
            .table-responsive { overflow: visible !important; }
            @page { size: A4 portrait; margin: 8mm; }
        }
    </style>
</head>
<body>

    <div class="container mt-4">
        <!-- BARRA DE ACCIÓN SUPERIOR -->
        <div class="action-bar">
            <div class="left-group">
                <a href="/menu" class="btn-custom btn-menu">⬅ Salir al Menú</a>
                <a href="/mis_planificaciones" class="btn-custom btn-view">📂 Ver Planificaciones</a>
            </div>
            <div class="right-group">
                <button type="submit" form="form-planificacion"
