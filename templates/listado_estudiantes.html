<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Listado de Estudiantes - SIGEM Mami Luisa</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>Listado General de Estudiantes</h2>
            <a href="/menu" class="btn btn-secondary">Volver al Menú</a>
        </div>

        <div class="card shadow-sm">
            <div class="card-body">
                <table class="table table-striped table-hover">
                    <thead class="table-dark">
                        <tr>
                            <th>No. Orden</th>
                            <th>ID Estudiante</th>
                            <th>Nombres</th>
                            <th>Apellidos</th>
                            <th>Grado</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for est in estudiantes %}
                        <tr>
                            <td><strong>{{ loop.index }}</strong></td>
                            <td>{{ est.id_estudiante }}</td>
                            <td>{{ est.nombres }}</td>
                            <td>{{ est.apellidos }}</td>
                            <td>{{ est.grado }}</td>
                        </tr>
                        {% else %}
                        <tr>
                            <td colspan="5" class="text-center text-muted">No hay estudiantes registrados todavía.</td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</body>
</html>
