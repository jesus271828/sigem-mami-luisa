<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Mis Planificaciones - SIGEM</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light p-4">
    <div class="container bg-white border p-4 shadow-sm">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h3>Mis Planificaciones Guardadas</h3>
            <div>
                <a href="/planificacion" class="btn btn-outline-secondary">Nueva Planificación</a>
                <a href="/menu" class="btn btn-primary">Ir al Menú</a>
            </div>
        </div>
        
        <table class="table table-hover table-bordered">
            <thead class="table-dark">
                <tr>
                    <th>Fecha Inicio</th>
                    <th>Grado</th>
                    <th>Áreas</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody>
                {% for p in planificaciones %}
                <tr>
                    <td>{{ p.f_inicio }}</td>
                    <td>{{ p.grado_seccion }}</td>
                    <td>{{ p.areas }}</td>
                    <td>
                        <!-- Botón que llama a la ruta que acabamos de crear en app.py -->
                        <a href="/imprimir_planificacion/{{ p.id }}" class="btn btn-success btn-sm">
                            Imprimir PDF
                        </a>
                    </td>
                </tr>
                {% else %}
                <tr>
                    <td colspan="4" class="text-center">No hay planificaciones guardadas aún.</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</body>
</html>
