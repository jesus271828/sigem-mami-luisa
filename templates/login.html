<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Acceso | SIGEM Mami Luisa</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root { --primary-color: #1A237E; }
        body { background-color: #f0f2f5; font-family: 'Segoe UI', sans-serif; height: 100vh; display: flex; align-items: center; justify-content: center; }
        .login-card { background: white; border-radius: 20px; border: none; box-shadow: 0 15px 35px rgba(0,0,0,0.1); padding: 40px; width: 100%; max-width: 400px; }
        .logo-img { max-width: 150px; display: block; margin: 0 auto 25px auto; }
        .btn-login { background-color: var(--primary-color); color: white; border-radius: 12px; padding: 12px; font-weight: 600; border: none; width: 100%; transition: 0.3s; }
        .btn-login:hover { background-color: #0d155e; color: white; }
        .form-control { border-radius: 10px; padding: 12px; border: 1px solid #ddd; }
    </style>
</head>
<body>

<div class="login-card">
    <img src="{{ url_for('static', filename='img/logo.png') }}" alt="Logo SIGEM Mami Luisa" class="logo-img">
    <h4 class="text-center mb-4 text-primary">Acceso al Sistema</h4>
    
    <form action="/login" method="POST">
        <div class="mb-3">
            <label class="form-label">Usuario</label>
            <input type="text" name="username" class="form-control" placeholder="Ingrese su usuario" required>
        </div>
        <div class="mb-4">
            <label class="form-label">Contraseña</label>
            <input type="password" name="password" class="form-control" placeholder="••••••••" required>
        </div>
        <button type="submit" class="btn btn-login">Ingresar al Panel</button>
    </form>
</div>

</body>
</html>
